<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Emma Doyle is a London-based Creative Strategist & Designer working across strategy, identity, digital experiences and culture.">
  <meta name="theme-color" content="#f4f1ea">
  <title>Emma Doyle — Creative Strategist & Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f1ea;
      --ink: #0a0a0a;
      --red: #d95040;
      --yellow: #f9eb40;
      --blue: #1b50ab;
      --green: #429448;
      --pink: #e581c4;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter Tight", Arial, sans-serif;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 18px 22px 20px;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -.02em;
      text-transform: uppercase;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }

    main {
      display: flex;
      align-items: center;
      padding: 70px 0;
    }

    h1 {
      margin: 0;
      max-width: 1500px;
      font-size: clamp(62px, 12.8vw, 210px);
      font-weight: 900;
      font-style: italic;
      line-height: .78;
      letter-spacing: -.085em;
      text-transform: uppercase;
    }

    .line { display: block; }

    .accent {
      position: relative;
      display: inline-block;
      transition: color .2s ease;
      cursor: default;
    }

    .accent:hover { color: var(--red); }
    .accent:nth-child(2):hover { color: var(--blue); }

    footer { align-items: flex-end; }

    .intro {
      max-width: 470px;
      font-size: clamp(15px, 1.35vw, 21px);
      font-weight: 500;
      line-height: 1.08;
      text-transform: none;
    }

    .soon {
      text-align: right;
      font-style: italic;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .35; transform: scale(.72); }
    }

    @media (max-width: 680px) {
      .page { padding: 15px; }
      header span:last-child { display: none; }
      main { padding: 50px 0; align-items: flex-start; }
      h1 {
        font-size: clamp(57px, 22vw, 102px);
        line-height: .8;
        word-break: normal;
      }
      footer {
        display: grid;
        gap: 28px;
      }
      .soon { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span>Emma Doyle</span>
      <span>London, UK</span>
      <span class="status"><i class="dot" aria-hidden="true"></i>Portfolio in progress</span>
    </header>

    <main>
      <h1 aria-label="Creative Strategist and Designer">
        <span class="line accent">Creative</span>
        <span class="line accent">Strategist</span>
        <span class="line">&amp; Designer</span>
      </h1>
    </main>

    <footer>
      <div class="intro">Research, strategy and design for brands, products and digital experiences.</div>
      <div class="soon">Selected work<br>coming soon.</div>
    </footer>
  </div>
</body>
</html>
